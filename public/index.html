<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>テスト秋祭り2026年</title>

  <!-- PWA: ホーム画面に追加して単独アプリのように起動できるようにする -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0ea5e9">
  <link rel="icon" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MONpass">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: '#0ea5e9' } } }
    }
  </script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <!-- html5-qrcode -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <!-- qrcode: QRコードはサーバーでは一切生成せず、すべてクライアント側で描画する。
       npmパッケージ側がCJS/ESMモジュールしか提供しておらず(単体のブラウザ用
       グローバル変数がない)、ここでESモジュールとしてimportし、他の
       classicスクリプト(pages/*.js)から使えるようwindow.QRCodeに代入している。 -->
  <script type="module">
    // window.QRCodeReadyは、classicスクリプト側(ESモジュールではない
    // pages/*.js)がライブラリの読み込み完了を`await`で待てるようにする
    // Promise。会場の不安定なWi-Fiでも、読み込み前にQR描画を試みて
    // 失敗する事故を防ぐための仕組み。
    window.QRCodeReady = import('https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm')
      .then(m => { window.QRCode = m.default; return window.QRCode; });
  </script>
  <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- ナビゲーションバー -->
  <nav class="bg-sky-500 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="#/login" class="font-bold text-lg tracking-tight">🎪 テスト秋祭り2026年</a>
      <div class="flex items-center gap-3 text-sm">
        <span id="nav-user" class="hidden opacity-90 text-sm"></span>
        <button id="logout-btn"
          class="hidden bg-white/20 hover:bg-white/30 px-3 py-1 rounded-full transition text-sm"
          onclick="logout()">
          ログアウト
        </button>
      </div>
    </div>
  </nav>

  <!-- メインコンテンツ -->
  <main class="max-w-5xl mx-auto px-4 py-6" id="app">
    <div class="flex justify-center py-20">
      <div class="animate-spin h-10 w-10 rounded-full border-4 border-sky-500 border-t-transparent"></div>
    </div>
  </main>

  <!-- トーストコンテナ（JSで動的生成） -->

  <!-- JS: いずれもビルドステップなしのclassicスクリプト(type="module"ではない)。
       読み込み順が重要: common.js/api.js/auth.jsが先に読み込まれ、以降のページ
       スクリプトからグローバル関数(showToast, API.get, Auth.isValid等)として
       参照できる前提になっている。 -->

  <!-- JS: 共通 -->
  <script src="/static/js/common.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>

  <!-- JS: ページ(#/qrや#/staffなど各ハッシュに対応するpage*関数を定義) -->
  <script src="/static/js/pages/login.js"></script>
  <script src="/static/js/pages/student-qr.js"></script>
  <script src="/static/js/pages/staff-scan.js"></script>
  <script src="/static/js/pages/admin.js"></script>

  <!-- JS: ルーター（最後に初期化） -->
  <script src="/static/js/router.js"></script>
  <script>
    // ルート登録。第3引数の配列は許可ロール(空配列=誰でもアクセス可能、
    // 'staff_or_admin'は特殊値でstaff/adminどちらでも通す)。router.js参照。
    Router.register('#/login',           pageStudentLogin,   []);
    Router.register('#/staff-login',     pageStaffLogin,     []);
    Router.register('#/qr',              pageStudentQr,      ['student']);
    Router.register('#/staff',           pageStaffScan,      ['staff_or_admin']);
    Router.register('#/admin',           pageAdminDashboard, ['admin']);
    Router.register('#/admin/tickets',   pageAdminTickets,   ['admin']);
    Router.register('#/admin/students',  pageAdminStudents,  ['admin']);
    Router.register('#/admin/import',    pageAdminImport,    ['admin']);
    Router.register('#/admin/staff',     pageAdminStaff,     ['admin']);
    Router.register('#/admin/settings',  pageAdminSettings,  ['admin']);

    // ナビバー更新
    function updateNavBar() {
      const nav = document.getElementById('nav-user');
      const btn = document.getElementById('logout-btn');
      if (Auth.isValid()) {
        const p = Auth.getPayload();
        nav.textContent = p.sub || '';
        nav.classList.remove('hidden');
        btn.classList.remove('hidden');
      } else {
        nav.classList.add('hidden');
        btn.classList.add('hidden');
      }
    }

    window.addEventListener('hashchange', updateNavBar);
    updateNavBar();

    // ダッシュボードページを離れたらタイマーをクリア
    window.addEventListener('hashchange', () => {
      if (!window.location.hash.startsWith('#/admin')) {
        if (typeof dashboardTimer !== 'undefined' && dashboardTimer) {
          clearInterval(dashboardTimer); dashboardTimer = null;
        }
        if (typeof chartInstance !== 'undefined' && chartInstance) {
          chartInstance.destroy(); chartInstance = null;
        }
      }
      if (!window.location.hash.startsWith('#/staff')) {
        if (typeof statusTimer !== 'undefined' && statusTimer) {
          clearInterval(statusTimer); statusTimer = null;
        }
      }
    });

    Router.init();

    // PWAとして「ホーム画面に追加」できるようにする最小のService Worker登録
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
