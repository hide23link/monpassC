<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 860" width="1290" height="860" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/>
    </marker>
  </defs>

  <rect width="1290" height="860" fill="#FFFFFF"/>

  <!-- タイトル -->
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0F172A">MONpass システム構成</text>
  <text x="40" y="80" font-size="14" fill="#64748B">Cloudflare Workers 1つで API と静的フロントエンドを同一オリジン配信（Pages・CORS設定・ビルド工程なし）</text>

  <!-- ===== 利用者（ブラウザ） ===== -->
  <text x="140" y="128" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">利用者（ブラウザ / PWA）</text>

  <g>
    <rect x="40" y="145" width="200" height="120" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
    <text x="140" y="180" font-size="20" font-weight="700" fill="#14532D" text-anchor="middle">生徒</text>
    <text x="140" y="204" font-size="13" fill="#166534" text-anchor="middle">スマホ</text>
    <text x="140" y="230" font-size="13" fill="#334155" text-anchor="middle">入場QRチケットを発行・表示</text>
    <text x="140" y="250" font-size="12" fill="#64748B" text-anchor="middle">（来場者ごとに1枚）</text>
  </g>
  <g>
    <rect x="40" y="305" width="200" height="120" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="140" y="340" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">スタッフ</text>
    <text x="140" y="364" font-size="13" fill="#1D4ED8" text-anchor="middle">スマホ（カメラ）</text>
    <text x="140" y="390" font-size="13" fill="#334155" text-anchor="middle">会場入口でQRをスキャン</text>
    <text x="140" y="410" font-size="12" fill="#64748B" text-anchor="middle">→ 入場処理</text>
  </g>
  <g>
    <rect x="40" y="465" width="200" height="120" rx="12" fill="#FAF5FF" stroke="#9333EA" stroke-width="1.5"/>
    <text x="140" y="500" font-size="20" font-weight="700" fill="#581C87" text-anchor="middle">管理者</text>
    <text x="140" y="524" font-size="13" fill="#7E22CE" text-anchor="middle">PC</text>
    <text x="140" y="550" font-size="13" fill="#334155" text-anchor="middle">ダッシュボード・名簿管理</text>
    <text x="140" y="570" font-size="12" fill="#64748B" text-anchor="middle">CSV入出力・設定</text>
  </g>

  <!-- ===== Cloudflare ===== -->
  <rect x="360" y="110" width="890" height="530" rx="16" fill="#FFFBF5" stroke="#F38020" stroke-width="2" stroke-dasharray="8 5"/>
  <rect x="376" y="98" width="214" height="26" rx="6" fill="#F38020"/>
  <text x="483" y="116" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Cloudflare（無料枠で稼働）</text>
  <text x="1234" y="138" font-size="12" fill="#9A3412" text-anchor="end">独自ドメイン（Custom Domain） または *.workers.dev</text>

  <!-- 利用者 → Worker -->
  <line x1="240" y1="205" x2="388" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="240" y1="365" x2="388" y2="365" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="240" y1="525" x2="388" y2="430" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="262" y="322" width="96" height="34" rx="6" fill="#FFFFFF"/>
  <text x="310" y="336" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">HTTPS</text>
  <text x="310" y="352" font-size="11" fill="#64748B" text-anchor="middle">同一オリジン</text>
  <rect x="262" y="376" width="96" height="34" rx="6" fill="#FFFFFF"/>
  <text x="310" y="390" font-size="11" fill="#64748B" text-anchor="middle">Authorization:</text>
  <text x="310" y="405" font-size="11" fill="#64748B" text-anchor="middle">Bearer &lt;JWT&gt;</text>

  <!-- Worker -->
  <rect x="390" y="150" width="520" height="470" rx="12" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.5"/>
  <text x="410" y="180" font-size="17" font-weight="700" fill="#9A3412">Cloudflare Workers</text>
  <text x="890" y="180" font-size="14" fill="#C2410C" text-anchor="end">Hono + TypeScript</text>
  <text x="410" y="202" font-size="12" fill="#64748B">全リクエストをまず Worker が受け、API以外は静的アセットへ（run_worker_first）</text>

  <!-- API -->
  <rect x="410" y="218" width="480" height="232" rx="10" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1"/>
  <text x="425" y="241" font-size="14" font-weight="700" fill="#7C2D12">JSON API</text>
  <rect x="425" y="252" width="450" height="30" rx="6" fill="#FED7AA"/>
  <text x="650" y="272" font-size="12.5" font-weight="700" fill="#7C2D12" text-anchor="middle">JWT認可ミドルウェア（ロール: student / staff / admin）</text>

  <rect x="425" y="294" width="143" height="142" rx="8" fill="#FFFFFF" stroke="#FB923C"/>
  <text x="496" y="320" font-size="16" font-weight="700" fill="#9A3412" text-anchor="middle" font-family="Menlo,Consolas,monospace">/auth</text>
  <text x="496" y="346" font-size="12.5" fill="#334155" text-anchor="middle">ログイン</text>
  <text x="496" y="366" font-size="12.5" fill="#334155" text-anchor="middle">JWT発行</text>
  <text x="496" y="392" font-size="11" fill="#64748B" text-anchor="middle">生徒 / スタッフ・</text>
  <text x="496" y="408" font-size="11" fill="#64748B" text-anchor="middle">管理者</text>

  <rect x="579" y="294" width="143" height="142" rx="8" fill="#FFFFFF" stroke="#FB923C"/>
  <text x="650" y="320" font-size="16" font-weight="700" fill="#9A3412" text-anchor="middle" font-family="Menlo,Consolas,monospace">/ticket</text>
  <text x="650" y="346" font-size="12.5" fill="#334155" text-anchor="middle">QR発行・一覧・削除</text>
  <text x="650" y="366" font-size="12.5" fill="#334155" text-anchor="middle">入場スキャン・取消</text>
  <text x="650" y="392" font-size="11" fill="#64748B" text-anchor="middle">生徒: 発行系</text>
  <text x="650" y="408" font-size="11" fill="#64748B" text-anchor="middle">スタッフ: スキャン系</text>

  <rect x="733" y="294" width="143" height="142" rx="8" fill="#FFFFFF" stroke="#FB923C"/>
  <text x="804" y="320" font-size="16" font-weight="700" fill="#9A3412" text-anchor="middle" font-family="Menlo,Consolas,monospace">/admin</text>
  <text x="804" y="346" font-size="12.5" fill="#334155" text-anchor="middle">集計ダッシュボード</text>
  <text x="804" y="366" font-size="12.5" fill="#334155" text-anchor="middle">生徒・スタッフ管理</text>
  <text x="804" y="386" font-size="12.5" fill="#334155" text-anchor="middle">CSV入出力・設定</text>
  <text x="804" y="408" font-size="11" fill="#64748B" text-anchor="middle">管理者のみ</text>

  <!-- 静的アセット -->
  <rect x="410" y="470" width="480" height="132" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="425" y="494" font-size="14" font-weight="700" fill="#1E293B">静的アセット（ASSETS バインディング / public/）</text>
  <text x="425" y="520" font-size="12.5" fill="#334155">・SPA（index.html + 素のJS・ハッシュルーティング）</text>
  <text x="425" y="542" font-size="12.5" fill="#334155">・PWA（manifest・最小限の Service Worker）</text>
  <text x="425" y="564" font-size="12.5" fill="#334155">・CSS・アイコン</text>
  <text x="425" y="588" font-size="11" fill="#64748B" font-family="Menlo,Consolas,monospace">app.get("*") → c.env.ASSETS.fetch()</text>

  <!-- D1 -->
  <g>
    <path d="M960,212 a125,18 0 0,1 250,0 v196 a125,18 0 0,1 -250,0 z" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <ellipse cx="1085" cy="212" rx="125" ry="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
    <text x="1085" y="258" font-size="18" font-weight="700" fill="#1E3A8A" text-anchor="middle">D1</text>
    <text x="1085" y="280" font-size="12.5" fill="#1D4ED8" text-anchor="middle">（サーバーレス SQLite）</text>
    <text x="990" y="312" font-size="12.5" fill="#334155" font-family="Menlo,Consolas,monospace">students</text>
    <text x="1080" y="312" font-size="11.5" fill="#64748B">生徒名簿</text>
    <text x="990" y="336" font-size="12.5" fill="#334155" font-family="Menlo,Consolas,monospace">tickets</text>
    <text x="1080" y="336" font-size="11.5" fill="#64748B">QRチケット</text>
    <text x="990" y="360" font-size="12.5" fill="#334155" font-family="Menlo,Consolas,monospace">staff</text>
    <text x="1080" y="360" font-size="11.5" fill="#64748B">スタッフ・管理者</text>
    <text x="990" y="384" font-size="12.5" fill="#334155" font-family="Menlo,Consolas,monospace">settings</text>
    <text x="1080" y="384" font-size="11.5" fill="#64748B">発行期間など</text>
  </g>
  <line x1="890" y1="335" x2="956" y2="335" stroke="#C2410C" stroke-width="2" marker-end="url(#arrO)"/>
  <text x="923" y="325" font-size="11" fill="#9A3412" text-anchor="middle">DB</text>

  <!-- Secrets / Vars -->
  <rect x="960" y="465" width="250" height="137" rx="10" fill="#FEFCE8" stroke="#CA8A04" stroke-width="1.5"/>
  <text x="975" y="490" font-size="14" font-weight="700" fill="#713F12">Secrets / 環境変数</text>
  <text x="975" y="516" font-size="12" fill="#334155" font-family="Menlo,Consolas,monospace">JWT_SECRET</text>
  <text x="1080" y="516" font-size="11" fill="#64748B">（secret）</text>
  <text x="975" y="538" font-size="12" fill="#334155" font-family="Menlo,Consolas,monospace">MAX_TICKETS</text>
  <text x="975" y="560" font-size="12" fill="#334155" font-family="Menlo,Consolas,monospace">ISSUE_START/END_DATE</text>
  <text x="975" y="582" font-size="12" fill="#334155" font-family="Menlo,Consolas,monospace">DOMAIN</text>
  <line x1="958" y1="533" x2="912" y2="533" stroke="#CA8A04" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <!-- ===== 外部CDN ===== -->
  <line x1="140" y1="585" x2="140" y2="688" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="152" y="642" font-size="11.5" fill="#64748B">ブラウザが直接読み込み</text>

  <rect x="40" y="692" width="1210" height="120" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="60" y="720" font-size="14" font-weight="700" fill="#334155">外部CDN（フロントエンド用ライブラリ）</text>

  <rect x="60" y="734" width="275" height="60" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="197" y="759" font-size="13.5" font-weight="700" fill="#1E293B" text-anchor="middle">qrcode</text>
  <text x="197" y="780" font-size="11.5" fill="#64748B" text-anchor="middle">QR画像はクライアント側で描画</text>

  <rect x="352" y="734" width="275" height="60" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="489" y="759" font-size="13.5" font-weight="700" fill="#1E293B" text-anchor="middle">html5-qrcode</text>
  <text x="489" y="780" font-size="11.5" fill="#64748B" text-anchor="middle">カメラでQRを読み取り</text>

  <rect x="644" y="734" width="275" height="60" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="781" y="759" font-size="13.5" font-weight="700" fill="#1E293B" text-anchor="middle">Chart.js</text>
  <text x="781" y="780" font-size="11.5" fill="#64748B" text-anchor="middle">ダッシュボードのグラフ</text>

  <rect x="936" y="734" width="294" height="60" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="1083" y="759" font-size="13.5" font-weight="700" fill="#1E293B" text-anchor="middle">Tailwind CSS</text>
  <text x="1083" y="780" font-size="11.5" fill="#64748B" text-anchor="middle">スタイリング</text>

  <text x="1250" y="846" font-size="11" fill="#94A3B8" text-anchor="end">MONpass（Cloudflare Workers版）</text>
</svg>
